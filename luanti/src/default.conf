# 方块世界 · Luanti 配置（1080p 均衡档）
# 基线取自参考项目 Block World CN 的调优参数，键位改成 Luanti 5.12+ 的 SYSTEM_SCANCODE_*。
# 三档光影：默认「均衡」，低配切「流畅」，独显可试「高画质」（见文件末尾）。

# ---------- 语言与字体 ----------
language = zh_CN
fallback_font_path = fonts/DroidSansFallbackFull.ttf
font_size = 18
mono_font_size = 16
gui_scaling = 0.9
hud_scaling = 0.8

# ---------- 显示与性能 ----------
screen_w = 1920
screen_h = 1080
fullscreen = false
autosave_screensize = false
video_driver = opengl3
fps_max = 90
fps_max_unfocused = 20
vsync = true
viewing_range = 112
max_block_send_distance = 10
max_block_generate_distance = 8
num_emerge_threads = 2
mesh_generation_threads = 4
mip_map = false
bilinear_filter = false
trilinear_filter = false
anisotropic_filter = false
antialiasing = fxaa

# ---------- 光影：均衡档 ----------
enable_dynamic_shadows = true
shadow_map_texture_size = 2048
shadow_map_max_distance = 100
shadow_soft_radius = 4.0
shadow_filters = 2
shadow_strength_gamma = 0.8
shadow_map_color = true
shadow_poisson_filter = true
enable_post_processing = true
tone_mapping = true
enable_bloom = true
enable_auto_exposure = true
exposure_compensation = 0.0
enable_volumetric_lighting = false
enable_water_reflections = true
enable_waving_water = true
enable_waving_leaves = true
enable_waving_plants = true
enable_translucent_foliage = true
ambient_occlusion_gamma = 1.55
leaves_style = fancy
smooth_lighting = true
enable_fog = true
fog_start = 0.55

# ---------- 玩法默认值 ----------
name = Player
menu_last_game = mineclonia
default_game = mineclonia
enable_server = false
server_announce = false
bind_address = 127.0.0.1
serverlist_url =
enable_split_login_register = false
enable_damage = true
creative_mode = false
mg_name = v7
mcl_difficulty = normal
sound_volume = 0.8
doubletap_jump = true
map_save_interval = 5
sqlite_synchronous = 2
enable_rollback_recording = false
movement_speed_fast = 12

# ---------- 键位（MC 习惯） ----------
keymap_forward = SYSTEM_SCANCODE_26
keymap_backward = SYSTEM_SCANCODE_22
keymap_left = SYSTEM_SCANCODE_4
keymap_right = SYSTEM_SCANCODE_7
keymap_jump = SYSTEM_SCANCODE_44
keymap_sneak = SYSTEM_SCANCODE_225
keymap_aux1 = SYSTEM_SCANCODE_224
keymap_inventory = SYSTEM_SCANCODE_8
keymap_drop = SYSTEM_SCANCODE_20
keymap_chat = SYSTEM_SCANCODE_23
keymap_screenshot = SYSTEM_SCANCODE_59
keymap_toggle_debug = SYSTEM_SCANCODE_60
keymap_camera_mode = SYSTEM_SCANCODE_62
keymap_toggle_profiler = SYSTEM_SCANCODE_63
keymap_console = SYSTEM_SCANCODE_67
keymap_freemove = SYSTEM_SCANCODE_14
keymap_fastmove = SYSTEM_SCANCODE_13
keymap_noclip = SYSTEM_SCANCODE_11
keymap_toggle_fog =

