name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读取依赖锁并下载校验
        run: |
          set -euo pipefail
          mkdir -p downloads
          jq -r '.artifacts[] | [.url, .file, .sha256] | @tsv' luanti/dependencies.lock.json |
          while IFS=$'\t' read -r url file sha; do
            echo "下载 $file"
            curl -fsSL "$url" -o "downloads/$file"
            echo "$sha  downloads/$file" | sha256sum -c -
          done

      - name: 组装便携包
        run: |
          set -euo pipefail
          mkdir -p "pkg/block-world-${GITHUB_REF_NAME}" tmp
          PKG="pkg/block-world-${GITHUB_REF_NAME}"
          unzip -q downloads/luanti-*-win64.zip -d tmp/engine
          cp -a tmp/engine/*/. "$PKG"/
          test -f "$PKG/bin/luanti.exe"
          unzip -q downloads/mineclonia-*.zip -d tmp/game
          mkdir -p "$PKG/games/mineclonia"
          cp -a tmp/game/*/. "$PKG/games/mineclonia/"
          test -f "$PKG/games/mineclonia/game.conf"
          cp luanti/src/default.conf "$PKG/minetest.conf"
          mkdir -p "$PKG/src" "$PKG/textures/local_classic_ui"
          cp luanti/src/menu.lua "$PKG/src/"
          mkdir -p "$PKG/mods"
          cp -a luanti/mods/. "$PKG/mods/"
          test -f "$PKG/mods/mc_music/init.lua"
          cp -a luanti/assets/. "$PKG/textures/local_classic_ui/"
          cp luanti/package/Start.cmd "$PKG/"
          cp luanti/package/README-zh.md "$PKG/"
          cp LICENSE NOTICE.md "$PKG/"
          mkdir -p "$PKG/worlds/blockworld"
          cp luanti/package/world.mt "$PKG/worlds/blockworld/world.mt"

      - name: 打包
        run: |
          set -euo pipefail
          cd pkg
          zip -qr "../block-world-${GITHUB_REF_NAME}.zip" "block-world-${GITHUB_REF_NAME}"
          cd ..
          ls -lh block-world-*.zip

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          name: 方块世界 ${{ github.ref_name }}（Luanti 便携包）
          files: block-world-*.zip
          body_path: .github/release-notes.md
          fail_on_unmatched_files: true
